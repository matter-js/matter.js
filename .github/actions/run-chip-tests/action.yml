name: 'Run a group of CHIP tests'
description: 'Runs a group of tests using matter-js/chip image'
inputs:
  image-source:
    description: 'Container source (artifact or repository)'
    required: true

  image-tag:
    description: 'Tag to pull when image-source is "repository"; the image is tagged "latest" locally, which the tests run'
    required: false
    default: 'latest'

  artifact-name:
    description: 'Name of the uploaded chip image artifact, when image-source is "artifact"'
    required: false
    default: 'chip-image'

  test-group:
    description: 'Name of the test group to run'
    required: true

  use-local-controller:
    description: 'Use the in-process matter.js WebSocket controller instead of chip-tool'
    required: false
    default: 'false'

  node-version:
    description: 'Node.js version'
    required: true
    default: '24.x'

runs:
  using: 'composite'
  steps:
    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install matter.js
      shell: bash
      run: npm ci --foreground-scripts

    - name: Pull image from repository
      if: inputs.image-source == 'repository'
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        docker pull "ghcr.io/matter-js/chip:$IMAGE_TAG"
        if [ "$IMAGE_TAG" != "latest" ]; then
          docker tag "ghcr.io/matter-js/chip:$IMAGE_TAG" ghcr.io/matter-js/chip:latest
        fi

    - name: Load image from artifact
      if: inputs.image-source == 'artifact'
      uses: ./.github/actions/load-chip
      with:
        artifact-name: ${{ inputs.artifact-name }}

    - name: Run tests
      shell: bash
      env:
        MATTER_LOCAL_CONTROLLER: ${{ inputs.use-local-controller == 'true' && '1' || '' }}
      run: |
        cd support/chip-testing
        npm run test-${{inputs.test-group}} -- --no-pull --report
