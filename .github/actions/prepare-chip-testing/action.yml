name: 'Chip Tool Tests'
description: 'prepares and executes Chip Tool and Certification tests'
author: 'Apollon77'
inputs:
  connectedhomeip-tag:
    description: 'Tag of the connectedhomeip repo to use'
    required: true
    default: 'master' # 'v1.5-branch'
  rebuild-chip-tool:
    description: 'Rebuild the chip-tool'
    required: true
    default: "false"
  runner-os:
    description: 'Runner Operating system'
    required: true
    default: 'Linux'
  build-matter-js:
    description: 'Also Build matter-js?'
    required: true
    default: "true"
  patch-test-yaml:
    description: 'Patch Yaml Files for Matter.js testrun?'
    required: true
    default: "false"
  python-venv:
    description: 'Restore or build the CHIP Python environment in connectedhomeip/out/venv (only the Python tests need it)'
    required: true
    default: "true"

runs:
  using: 'composite'
  steps:
    - name: Install Debian deps
      id: install-deps
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y git gcc g++ pkg-config libssl-dev libdbus-1-dev libglib2.0-dev libavahi-client-dev ninja-build python3-venv python3-dev python3-pip unzip libgirepository1.0-dev libgirepository-2.0-dev libcairo2-dev libreadline-dev libpcsclite-dev libevent-dev
        sudo mkdir -p /var/lib/thread

    - name: Prepare Bin Directory
      id: prepare_bin
      shell: bash
      run: |
        mkdir bin

    - name: Get current date and OS release
      id: date
      shell: bash
      run: |
        echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
        # Host-built binaries and the Python environment in the caches work only on the OS release that built them
        echo "OS_RELEASE=$(. /etc/os-release && echo "$ID$VERSION_ID")" >> $GITHUB_ENV
        # Same sanitizer as the CHIP CI Linux test jobs. Part of the bin cache key, so binaries of another variant are
        # never restored.
        echo "CHIP_BUILD_VARIANT=ipv6only-no-ble-no-wifi-no-shell-asan-clang" >> $GITHUB_ENV

    - name: Cache Bin files
      id: cache-bin
      uses: actions/cache@v5
      env:
        cache-name: chip-bin
      with:
        path: ./bin
        key: ${{ inputs.runner-os }}-${{ env.OS_RELEASE }}-build-yaml-${{ env.cache-name }}-${{ env.CHIP_BUILD_VARIANT }}-${{ inputs.connectedhomeip-tag }}-${{ env.DATE }}

    - name: Checkout Matter SDK
      id: checkout-sdk
      shell: bash
      run: |
        git clone https://github.com/project-chip/connectedhomeip.git --depth=1 --branch=${{ inputs.connectedhomeip-tag }}
        cd connectedhomeip
        scripts/checkout_submodules.py --shallow --platform linux

    - name: Cache Python Environments files
      id: cache-env
      uses: actions/cache@v5
      env:
        cache-name: chip-env
      with:
        path: ./connectedhomeip/.environment
        key: ${{ inputs.runner-os }}-${{ env.OS_RELEASE }}-env-${{ env.cache-name }}-${{ inputs.connectedhomeip-tag }}-${{ env.DATE }}

    # Later steps use only the Python environment from out/. The app build directories stay out of the cache because
    # the cache archive is written to and read from the root disk, which has little free space in the release jobs.
    - if: ${{ inputs.python-venv == 'true' }}
      name: Cache Chip Python environment
      id: cache-venv
      uses: actions/cache@v5
      env:
        cache-name: chip-venv
      with:
        path: ./connectedhomeip/out/venv
        key: ${{ inputs.runner-os }}-${{ env.OS_RELEASE }}-venv-${{ env.cache-name }}-${{ inputs.connectedhomeip-tag }}-${{ env.DATE }}

    # Only build if cache is not hit or if the commit message contains '[rebuild-chip]'
    - if: ${{ inputs.python-venv == 'true' && (steps.cache-env.outputs.cache-hit != 'true' || steps.cache-venv.outputs.cache-hit != 'true' || inputs.rebuild-chip-tool == 'true') }}
      name: Build python framework
      id: build-python
      shell: bash
      run: |
        cd connectedhomeip
        ./scripts/run_in_build_env.sh './scripts/build_python.sh --install_virtual_env out/venv'
        # The wheels are installed into out/venv, the build tree is not needed afterwards
        rm -rf out/python_lib

    # Only build if cache is not hit or if the commit message contains '[rebuild-chip]'
    # One target at a time, deleting its build directory after copying the binary, like the CHIP CI REPL build: the
    # disk then holds one build tree instead of all of them.
    - if: ${{ steps.cache-bin.outputs.cache-hit != 'true' || inputs.rebuild-chip-tool == 'true' }}
      name: Build executables
      id: build-executables
      env:
        # <build_examples.py app name>:<binary name>
        CHIP_APPS: >-
          chip-tool:chip-tool
          all-clusters:chip-all-clusters-app
          all-devices:all-devices-app
          lock:chip-lock-app
          tv-app:chip-tv-app
          bridge:chip-bridge-app
          lit-icd:lit-icd-app
          microwave-oven:chip-microwave-oven-app
          rvc:chip-rvc-app
          network-manager:matter-network-manager-app
          energy-gateway:chip-energy-gateway-app
          evse:chip-evse-app
      shell: bash
      run: |
        cd connectedhomeip
        ./scripts/run_in_build_env.sh '
          set -e
          for app in $CHIP_APPS; do
            target="linux-x64-${app%%:*}-${CHIP_BUILD_VARIANT}"
            ./scripts/build/build_examples.py --target "$target" build
            cp "out/$target/${app#*:}" ../bin/
            rm -rf "out/$target"
          done
        '

    - name: Display used binaries
      shell: bash
      run: |
        echo "Connected IP Branch: ${{ inputs.connectedhomeip-tag }}"
        ls -la bin
        df -h / .

    - if: ${{ inputs.build-matter-js == 'true' }}
      name: Install and build matter.js
      shell: bash
      run: |
        npm ci

    - if: ${{ inputs.patch-test-yaml == 'true' }}
      name: Patch test definitions
      shell: bash
      run: |
        cp -r support/chip-testing/patched-test-files/* connectedhomeip/src/app/tests/suites/
      # needed as long as we are still on Matter 1.1 but use tests from master branch from SDK

    - name: Tweak security settings to prevent errors on Ubuntu containers
      shell: bash
      run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0

    # The same runtime settings as the CHIP CI Linux test jobs: leak detection on, and the symbolizer from the build
    # environment so ASAN and LSAN reports show source lines.
    - name: Set ASAN options for the CHIP binaries
      shell: bash
      run: |
        echo "LSAN_OPTIONS=detect_leaks=1" >> "$GITHUB_ENV"
        cd connectedhomeip
        ./scripts/run_in_build_env.sh '
          symbolizer="$(command -v llvm-symbolizer || true)"
          if [ -n "$symbolizer" ]; then
            echo "ASAN_SYMBOLIZER_PATH=$symbolizer" >> "$GITHUB_ENV"
          fi
        '
