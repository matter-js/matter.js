# TEMPORARY - delete before merge.
# Runs the CHIP part of the nightly and official release jobs on a pull request, because a manual run of those
# workflows publishes a release. The steps are copied from nightly-dev-release.yml up to and including
# "chip-tool-test execution"; nothing after that, so nothing is versioned or published.
name: TEMPORARY verify release job CHIP steps

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-release-chip:
    if: github.head_ref == 'ci/chip-host-build-disk'
    runs-on: ubuntu-24.04

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 8192
        temp-reserve-mb: 3096
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Prepare testing environment
      uses: ./.github/actions/prepare-env

    - name: Prepare Webbrowser testing environment
      uses: ./.github/actions/prepare-webtests

    - name: Execute tests
      run: npm run test

    - name: Disk after tests
      run: df -h / .

    - name: Prepare chip tests
      uses: ./.github/actions/prepare-chip-testing
      with:
        build-matter-js: "false"
        patch-test-yaml: "true"
        python-venv: "false"

    - name: chip-tool-test execution
      id: test-execution
      shell: bash
      run: |
        cd connectedhomeip
        ./scripts/run_in_build_env.sh  \
          './scripts/tests/run_test_suite.py \
            --runner chip_tool_python \
            --log-level info \
            --target-glob "{Test_TC_ACE_*,Test_TC_ACL_*,Test_AddNewFabricFromExistingFabric,Test_TC_APBSC_*,Test_TC_BINFO_*,Test_TC_BOOL_*,Test_TC_BRBINFO_*,Test_TC_CADMIN_*,Test_TC_CC_*,Test_TC_CGEN_*,Test_TC_CNET_*,Test_TC_DGGEN_*,Test_TC_DESC_*,Test_TC_FLABEL_*,Test_TC_FLW_*,Test_TC_I_*,Test_TC_LCFG_*,Test_TC_LOWPOWER_*,Test_TC_LTIME_*,Test_TC_LUNIT_*,Test_TC_LVL_*,Test_TC_MOD_*,Test_TC_OCC_*,Test_TC_OO_*,Test_TC_OPCREDS_*,Test_TC_PCC_*,Test_TC_PRS_*,Test_TC_PS_*,Test_TC_RH_*,Test_TC_SWTCH_*,Test_TC_TMP_*,Test_TC_TSUIC_*,Test_TC_ULABEL_*,Test_TC_WAKEONLAN_*,Test_TV_WNCV_*,TestArmFailSafe,TestCASERecovery,TestCommandsById,TestCommissioningWindow,TestFabricRemovalWhileSubscribed,TestGeneralCommissioning,TestMultiAdmin,TestOperationalCredentialsCluster,TestSubscribe_*,TestUserLabelCluster,TestDiscovery}" \
              --target-skip-glob "{Test_TC_ACE_1_6,Test_TC_LVL_9_1,Test_TC_OO_2_7,Test_TC_LVL_9_1}" \
            run \
            --iterations 1 \
            --tool-path chip-tool:../bin/chip-tool \
            --app-path all-clusters:../support/chip-testing/dist/esm/AllClustersTestApp.js \
            --app-path all-devices:../support/chip-testing/dist/esm/AllClustersTestApp.js \
            --app-path bridge:../support/chip-testing/dist/esm/BridgeTestApp.js \
            --app-path tv:../support/chip-testing/dist/esm/TvTestApp.js \
            --app-path rvc:../support/chip-testing/AllClustersTestApp.sh \
            --app-path lit-icd:../support/chip-testing/AllClustersTestApp.sh \
          '

    - name: Disk after chip tests
      if: always()
      run: df -h / .
