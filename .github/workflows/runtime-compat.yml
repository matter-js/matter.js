# Runs matter.js against runtimes other than Node.js, so a regression in their compatibility surfaces here rather
# than in a user's deployment. Bun and Deno emulate Node.js's crypto API incompletely, so a runtime that
# regresses there is invisible to the Node.js suite.
name: Runtime compatibility

on:
  schedule:
    # Nightly, offset from the other scheduled jobs
    - cron: "40 2 * * *"
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/runtime-compat.yml"
      - ".github/scripts/crypto-smoke.mjs"
      - ".github/scripts/pack-and-smoke.sh"
      - "packages/general/src/crypto/**"
      - "packages/general/test/crypto/**"
      - "packages/nodejs/src/crypto/**"
      - "packages/nodejs/src/environment/**"
      - "packages/nodejs/test/crypto/**"

concurrency:
  group: ${{ github.ref }}-runtime-compat
  cancel-in-progress: true

jobs:
  bun:
    name: Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare testing environment
        uses: ./.github/actions/prepare-env

      - name: Build
        run: npm run build

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Report versions
        run: bun --version

      # Bun runs the test harness and the tests themselves. The AES-CCM suites skip themselves, keyed on
      # NodeJsCrypto.defect rather than on the runtime's name, so they resume where Bun implements the cipher.
      #
      # @matter/general and @matter/node are absent while each still has one Bun-specific failure unrelated to
      # crypto: an error-formatting test that reads stack frames Bun renders differently, and one ICD timing test.
      - name: Test @matter/nodejs
        run: bun node_modules/.bin/matter-test --prefix packages/nodejs

      - name: Test @matter/protocol
        run: bun node_modules/.bin/matter-test --prefix packages/protocol

      - name: Smoke test the published package
        run: .github/scripts/pack-and-smoke.sh bun

  deno:
    name: Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare testing environment
        uses: ./.github/actions/prepare-env

      - name: Build
        run: npm run build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: vx.x.x

      - name: Report versions
        run: deno --version

      # Deno cannot run the harness against this checkout: it resolves "#" imports against the entry point's package
      # scope rather than the referring module's, so they land on src/*.js, which exists only as TypeScript. The
      # published package is what a Deno application consumes anyway.
      - name: Smoke test the published package
        run: .github/scripts/pack-and-smoke.sh deno run --allow-read --allow-env --allow-sys
