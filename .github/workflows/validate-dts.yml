# Validates that the published .d.ts artifacts of @matter/* packages compile cleanly under strict
# TypeScript without skipLibCheck.  Catches issues that matter.js's internal build hides via
# skipLibCheck=true and customConditions=["dev-types"], but which downstream consumers will hit.
#
# Runs daily on schedule and on demand via workflow_dispatch.  Also runs on PRs that touch the
# codegen pipeline so regressions are caught at PR time.
name: Validate published .d.ts

on:
  schedule:
    - cron: "37 4 * * *" # daily at 04:37 UTC
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "support/codegen/**"
      - "support/tools/check-dts.mjs"
      - "packages/**/src/**/*.ts"
      - "packages/**/src/**/*.d.ts"
      - "package.json"
      - "package-lock.json"
      - "packages/**/package.json"
      - ".github/workflows/validate-dts.yml"

# Cancel a superseded run for the same ref, but keep the trigger in the group: a push must not cancel a manual
# or scheduled run on the same ref, and those two queue rather than cancel each other.
concurrency:
  group: ${{ github.ref }}-${{ github.event_name }}-validate-dts
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  validate-dts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare environment
        uses: ./.github/actions/prepare-env
      - name: Build packages
        run: npm run build-clean
      - name: Validate published .d.ts
        run: npm run validate-dts
